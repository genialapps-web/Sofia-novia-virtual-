<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Amor Virtual - Sofía</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <style>
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); }
    @keyframes pulse-soft { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
    .anniversary-badge { animation: pulse-soft 2s infinite; }
    .msg-image { max-width:240px; border-radius:14px; margin:6px 0; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
    .msg-audio, .btn-audio { width:260px; margin:6px 0; }
    .btn-audio { width:auto; padding:0.4rem 1rem; border-radius:999px; background:#fbcfe8; color:#be185d; font-size:0.8rem; border:none; cursor:pointer; transition:all 0.2s; }
    .btn-audio:hover { background:#f9a8d4; transform:scale(1.05); }
    .btn-audio:disabled { opacity:0.5; cursor:not-allowed; }
    
    /* ✅ Fondo dinámico de Sofía con opacidad al 80% como pediste */
    body {
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 241, 242, 0.82); /* Se combina con la opacidad que pongas */
      z-index: -1;
    }
    
    html,body { height:100%; }
    #chat-box { height:calc(100vh - 190px); min-height:380px; }
    .profile-thumb { width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #fda4af; }
  </style>
</head>
<body>

  <!-- ✅ El fondo se carga automáticamente desde lo que subas al panel -->

  <header class="glass sticky top-0 z-20 border-b border-rose-200 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="sofia-avatar" src="" alt="Sofía" class="profile-thumb bg-rose-100">
        <div>
          <p class="font-bold text-sm text-rose-800" id="sofia-name">Sofía</p>
          <p class="text-[11px] text-rose-600" id="sofia-details">En línea ❤️</p>
        </div>
      </div>
      <div id="counter-banner" class="text-xs font-semibold text-rose-700">Cargando...</div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full flex flex-col p-4">
    <section id="chat-box" class="flex flex-col">
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-1 py-2 min-h-[300px] rounded-xl">
        <p class="text-center text-slate-500 text-sm">Preparando nuestra charla...</p>
      </div>
      
      <form id="chat-form" class="mt-3 flex gap-2">
        <input type="text" id="chat-input" placeholder="Escribe algo bonito..." required disabled
          class="flex-1 px-4 py-3 rounded-full border border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white text-sm shadow-sm">
        <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white p-3 rounded-full shadow-md transition-all disabled:opacity-50" disabled>
          <i class="fas fa-paper-plane px-1"></i>
        </button>
      </form>
    </section>
  </main>

  <!-- ✅ Navegación que abre las páginas nuevas y completas -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-rose-200 py-2.5 z-20">
    <div class="max-w-md mx-auto flex justify-around text-xs">
      <a href="index.html" class="flex flex-col items-center gap-1 text-rose-500 font-bold"><i class="fas fa-comments text-lg"></i> Chat</a>
      <a href="galeria.html" class="flex flex-col items-center gap-1 text-slate-600 hover:text-rose-500"><i class="fas fa-images text-lg"></i> Galería</a>
      <a href="regalos.html" class="flex flex-col items-center gap-1 text-slate-600 hover:text-rose-500"><i class="fas fa-gift text-lg"></i> Regalos</a>
      <a href="tienda.html" class="flex flex-col items-center gap-1 text-slate-600 hover:text-rose-500"><i class="fas fa-store text-lg"></i> Tienda</a>
      <a href="perfil.html" class="flex flex-col items-center gap-1 text-slate-600 hover:text-rose-500"><i class="fas fa-user text-lg"></i> Perfil</a>
    </div>
  </nav>

  <script src="config.js"></script>
  <script>
    let app, db, auth, userId = localStorage.getItem('firebase_user_id'), chatHistory = [], unsubscribeChat, configGlobal = {};

    async function iniciarTodo() {
      try {
        app = firebase.initializeApp(APP_CONFIG.firebase);
        db = firebase.firestore();
        auth = firebase.auth();
        await cargarConfiguracionGlobal();
        await iniciarSesion();
      } catch(e) {
        console.error("Error al iniciar:", e);
      }
    }

    async function cargarConfiguracionGlobal() {
      try {
        const doc = await db.collection('configuracion').doc('general').get();
        if(doc.exists) {
          configGlobal = doc.data();
          
          // ✅ Se pone automáticamente la foto y datos que subiste al panel
          document.getElementById('sofia-name').textContent = configGlobal.nombreSofia || 'Sofía';
          document.getElementById('sofia-details').textContent = configGlobal.datosSofia || 'En línea ❤️';
          
          if(configGlobal.fotoPerfilSofia) {
            document.getElementById('sofia-avatar').src = configGlobal.fotoPerfilSofia;
          }
          
          // ✅ Se coloca la imagen de fondo y la opacidad exacta que definiste
          if(configGlobal.fondoChatSofia) {
            const opacidad = configGlobal.opacidadFondo ?? 80;
            document.body.style.backgroundImage = `url('${configGlobal.fondoChatSofia}')`;
            document.body.style.setProperty('--fondo-opacidad', `${opacidad}%`);
            document.body.querySelector('body::before').style.opacity = `${(100 - opacidad)/100}`;
          }
        }
      } catch(e) {
        console.log("Usando valores por defecto de Sofía");
      }
    }

    async function iniciarSesion() {
      if (!userId) {
        const cred = await auth.signInAnonymously();
        userId = cred.user.uid;
        localStorage.setItem('firebase_user_id', userId);
      }
      await prepararUsuario();
      await cargarConversacion();
      activarInterfaz();
    }

    async function prepararUsuario() {
      const refUsuario = db.collection('usuarios').doc(userId);
      const doc = await refUsuario.get();
      
      if(!doc.exists) {
        await refUsuario.set({
          fechaInicio: firebase.firestore.FieldValue.serverTimestamp(),
          nombre: '',
          correo: '',
          datosCompletados: false,
          monedas: 0,
          tipoUsuario: 'gratis',
          suscripcion: 'ninguna',
          audiosEscuchados: 0
        });
        
        await refUsuario.collection('chat').add({
          sender: 'bot',
          text: configGlobal.promptSofia ? '¡Hola mi amor! Me alegro mucho de que estemos juntos 🥰 ¿Cómo te ha ido hoy?' : '¡Hola! Soy Sofía, tu novia virtual. Me encanta platicar contigo ❤️',
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    async function cargarConversacion() {
      const refUsuario = db.collection('usuarios).doc(userId);
      unsubscribeChat = refUsuario.collection('chat').orderBy('fecha', 'asc').onSnapshot(snap => {
        chatHistory = snap.docs.map(doc => doc.data());
        dibujarChat();
        actualizarContador();
      });
    }

    function dibujarChat() {
      const caja = document.getElementById('chat-messages');
      caja.innerHTML = '';
      
      if(!chatHistory.length) {
        caja.innerHTML = `<p class="text-center text-slate-400 text-sm">Aún no tenemos mensajes 🥺</p>`;
        return;
      }

      chatHistory.forEach(msg => {
        const esUsuario = msg.sender === 'user';
        let contenidoAdicional = '';

        // ✅ Aquí sí aparecen las fotos que mandas desde el panel o chat
        if(msg.foto) contenidoAdicional += `<br><img src="${msg.foto}" class="msg-image" loading="lazy">`;
        if(msg.audio) contenidoAdicional += `<br><audio controls class="msg-audio"><source src="${msg.audio}" type="audio/mpeg">`;
        
        // Botón de escuchar voz
        const textoSeguro = msg.text.replace(/'/g,"\\'").replace(/"/g,'&quot;');
        const botonVoz = !esUsuario ? `<br><button class="btn-audio" onclick="reproducirVoz('${textoSeguro}', this)">🔊 Escuchar</button>` : '';

        caja.insertAdjacentHTML('beforeend', `
          <div class="flex ${esUsuario ? 'justify-end' : 'justify-start'} mb-3">
            <div class="${esUsuario ? 'bg-rose-500 text-white' : 'bg-white border border-rose-100'} max-w-[82%] px-4 py-3 rounded-2xl shadow-sm text-sm break-words">
              ${(msg.text || '').replace(/\n/g, '<br>')} ${contenidoAdicional} ${botonVoz}
            </div>
          </div>
        `);
      });

      caja.scrollTop = caja.scrollHeight;
    }

    async function reproducirVoz(texto, boton) {
      boton.disabled = true; boton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      
      try {
        const clave = configGlobal.elevenKey || APP_CONFIG.elevenlabs?.apiKey;
        if(!clave) throw new Error('Configura la voz en el panel primero');

        const respuesta = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + (configGlobal.elevenVoiceId || APP_CONFIG.elevenlabs.vozId), {
          method: 'POST',
          headers: { 'xi-api-key': clave, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: texto,
            model_id: configGlobal.elevenModel || 'eleven_multilingual_v2',
            voice_settings: {
              stability: configGlobal.elevenStability ?? 0.72,
              similarity_boost: configGlobal.elevenSimilarity ?? 0.8,
              speed: configGlobal.elevenSpeed ?? 0.9
            }
          })
        });

        if(!respuesta.ok) throw new Error('Error al generar audio');
        const datosAudio = await respuesta.blob();
        const reproductor = new Audio(URL.createObjectURL(datosAudio));
        await reproductor.play();

      } catch(e) {
        alert(`❌ ${e.message}`);
      } finally {
        boton.disabled = false; boton.innerHTML = '🔊 Escuchar';
      }
    }

    function actualizarContador() {
      const caja = document.getElementById('counter-banner');
      if(!chatHistory.length) return;
      
      const fechaInicio = chatHistory[0].fecha?.toDate() || new Date();
      const dias = Math.floor((Date.now() - fechaInicio) / (86400000));

      if(dias >= 365) {
        caja.className = "bg-amber-100 border border-amber-300 rounded-full py-1.5 px-3 text-xs font-bold text-amber-800 shadow-sm anniversary-badge";
        caja.innerHTML = "🎉 ¡Feliz primer año juntos! ❤️";
      } else {
        caja.className = "bg-rose-100 border border-rose-300 rounded-full py-1.5 px-3 text-xs font-semibold text-rose-700";
        caja.innerHTML = `${dias} días juntos 🥰`;
      }
    }

    function activarInterfaz() {
      document.querySelectorAll('#chat-input, #chat-form button').forEach(el => el.disabled = false);
    }

    // Enviar mensajes
    document.getElementById('chat-form').addEventListener('submit', async e => {
      e.preventDefault();
      const entrada = document.getElementById('chat-input');
      const texto = entrada.value.trim();
      if(!texto) return;

      entrada.disabled = true;
      await db.collection('usuarios').doc(userId).collection('chat').add({
        sender: 'user', text: texto, fecha: firebase.firestore.FieldValue.serverTimestamp()
      });
      entrada.value = '';

      // Generar respuesta
      try {
        const claveIA = configGlobal.apiKey || APP_CONFIG.ai.apiKey;
        const respuesta = await fetch(`${APP_CONFIG.ai.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${claveIA}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: APP_CONFIG.ai.model,
            temperature: 0.85,
            system_prompt: configGlobal.promptSofia || APP_CONFIG.ai.systemPrompt,
            messages: chatHistory.slice(-15).map(m => ({role: m.sender === 'user' ? 'user' : 'assistant', content: m.text}))
          })
        });

        const datos = await respuesta.json();
        await db.collection('usuarios').doc(userId).collection('chat').add({
          sender: 'bot',
          text: datos.choices[0].message.content.trim(),
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        });

      } catch(e) {
        await db.collection('usuarios').doc(userId).collection('chat').add({
          sender: 'bot',
          text: "Perdón, se me cortó un ratito pero sigo aquí contigo ❤️",
          fecha: firebasefirestore.FieldValue.serverTimestamp()
        });
      } finally {
        entrada.disabled = false;
      }
    });

    document.addEventListener('DOMContentLoaded', iniciarTodo);
    window.addEventListener('beforeunload', () => unsubscribeChat && unsubscribeChat());
  </script>

</body>
  </html>
