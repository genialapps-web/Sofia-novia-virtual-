<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Amor Virtual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <style>
    .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); }
    @keyframes pulse-soft { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
    .anniversary-badge { animation: pulse-soft 2s infinite; }
    .msg-image { max-width:220px; border-radius:12px; margin:4px 0; }
    .msg-audio, .btn-audio { width:240px; margin:4px 0; }
    .btn-audio { width:auto; padding:0.3rem 0.8rem; border-radius:999px; background:#fbcfe8; color:#be185d; font-size:0.75rem; border:none; cursor:pointer; }
    .btn-audio:hover { background:#f9a8d4; }
    .btn-audio:disabled { opacity:0.5; }
    .gallery-img { width:100%; height:140px; object-fit:cover; border-radius:10px; transition:transform .2s; }
    .gallery-img:hover { transform:scale(1.05); }
    .gallery-item { overflow:hidden; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .gallery-audio { padding:12px; background:white; border-radius:12px; text-align:center; border:1px solid #fda4af; }
    html,body { height:100%; }
    #tab-chat { height:calc(100vh - 180px); min-height:400px; }
  </style>
</head>
<body class="bg-rose-50 text-slate-800 min-h-screen flex flex-col font-sans pb-16">

  <header class="glass sticky top-0 z-20 border-b border-rose-200 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto text-center">
      <div id="counter-banner" class="bg-rose-100 border border-rose-300 rounded-full py-1.5 px-4 text-xs font-semibold text-rose-700">Cargando...</div>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full flex-1 flex flex-col p-4">
    <section id="tab-chat" class="flex flex-col">
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-1 py-2 min-h-[280px]">
        <p class="text-center text-slate-400 text-sm">Cargando conversación...</p>
      </div>
      <form id="chat-form" class="mt-2 flex gap-2">
        <input type="text" id="chat-input" placeholder="Escribe un mensaje amoroso..." required disabled
          class="flex-1 px-4 py-3 rounded-full border border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white text-sm shadow-sm">
        <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white p-3 rounded-full shadow-md transition-all disabled:opacity-50" disabled>
          <i class="fas fa-paper-plane px-1"></i>
        </button>
      </form>
    </section>

    <section id="tab-gallery" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-rose-700 flex items-center gap-2"><i class="fas fa-images"></i> Mis Recuerdos Contigo</h2>
      <p class="text-xs text-slate-500">Todo lo que te he compartido ❤️</p>
      <div id="gallery-content" class="grid grid-cols-2 gap-3">
        <p class="col-span-2 text-center text-slate-400 text-sm py-8">Aún no tenemos recuerdos 🥺</p>
      </div>
    </section>

    <section id="tab-gifts" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-rose-700 flex items-center gap-2"><i class="fas fa-gift"></i> Envíame un Detalle</h2>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="sendGift('Flores 🌹')" class="p-4 bg-white border border-rose-200 rounded-2xl shadow-sm text-center hover:bg-rose-50 transition-all disabled:opacity-50" disabled>
          <span class="text-3xl block mb-1">🌹</span><span class="text-xs font-semibold text-rose-700">Ramo de Rosas</span>
        </button>
        <button onclick="sendGift('Chocolates 🍫')" class="p-4 bg-white border border-rose-200 rounded-2xl shadow-sm text-center hover:bg-rose-50 transition-all disabled:opacity-50" disabled>
          <span class="text-3xl block mb-1">🍫</span><span class="text-xs font-semibold text-rose-700">Chocolates</span>
        </button>
        <button onclick="sendGift('Peluche 🧸')" class="p-4 bg-white border border-rose-200 rounded-2xl shadow-sm text-center hover:bg-rose-50 transition-all disabled:opacity-50" disabled>
          <span class="text-3xl block mb-1">🧸</span><span class="text-xs font-semibold text-rose-700">Peluche</span>
        </button>
        <button onclick="sendGift('Carta de Amor 💌')" class="p-4 bg-white border border-rose-200 rounded-2xl shadow-sm text-center hover:bg-rose-50 transition-all disabled:opacity-50" disabled>
          <span class="text-3xl block mb-1">💌</span><span class="text-xs font-semibold text-rose-700">Carta Bonita</span>
        </button>
      </div>
    </section>

    <section id="tab-profile" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-2xl border border-rose-200 shadow-sm space-y-3">
        <h2 class="text-lg font-bold text-rose-700">Tu Perfil</h2>
        <p class="text-xs text-slate-500">Ingresa tus datos para guardar tu progreso.</p>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tu Nombre</label>
          <input type="text" id="user-name" placeholder="Ej. Carlos" class="w-full px-3 py-2 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-rose-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tu Correo</label>
          <input type="email" id="user-email" placeholder="correo@ejemplo.com" class="w-full px-3 py-2 border rounded-lg text-sm border-slate-300 focus:ring-2 focus:ring-rose-400 focus:outline-none">
        </div>
        <button onclick="saveUserProfile()" class="w-full bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-lg text-sm font-semibold shadow transition-all disabled:opacity-50">Guardar Datos</button>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-rose-200 py-2 z-20">
    <div class="max-w-md mx-auto flex justify-around text-xs text-slate-500">
      <button onclick="switchTab('chat')" id="nav-chat" class="flex flex-col items-center gap-1 text-rose-500 font-bold"><i class="fas fa-comments text-lg"></i> Chat</button>
      <button onclick="switchTab('gallery')" id="nav-gallery" class="flex flex-col items-center gap-1"><i class="fas fa-images text-lg"></i> Galería</button>
      <button onclick="switchTab('gifts')" id="nav-gifts" class="flex flex-col items-center gap-1"><i class="fas fa-gift text-lg"></i> Regalos</button>
      <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1"><i class="fas fa-user text-lg"></i> Perfil</button>
    </div>
  </nav>

  <script src="config.js"></script>
  <script>
    let app, db, auth, userId = localStorage.getItem('firebase_user_id'), chatHistory = [], galleryItems = [], startDate, apiKeyFromFirebase, unsubscribeChat, unsubscribeGallery, listo = false, audioActivo;

    async function init() {
      try {
        app = firebase.initializeApp(APP_CONFIG.firebase);
        db = firebase.firestore();
        auth = firebase.auth();
        await login();
      } catch(e) {
        console.error("Error:", e);
        usarLocal();
      }
    }

    async function login() {
      if (!userId) {
        const cred = await auth.signInAnonymously();
        userId = cred.user.uid;
        localStorage.setItem('firebase_user_id', userId);
      }
      await cargarConfig();
      await verUsuario();
      await cargarDatos();
      habilitar();
    }

    async function cargarConfig() {
      try {
        const d = await db.collection('configuracion').doc('general').get();
        if(d.exists) apiKeyFromFirebase = d.data().apiKey;
      } catch(e){}
    }

    async function verUsuario() {
      const ref = db.collection('usuarios').doc(userId);
      const doc = await ref.get();
      if(!doc.exists){
        startDate = new Date().toISOString();
        const msg = { sender:'bot', text:'¡Hola mi amor! Me alegra mucho verte 🥰 ¿Cómo estuvo tu día?', fecha:firebase.firestore.FieldValue.serverTimestamp() };
        await ref.set({ fecha_inicio:startDate, nombre:'', correo:'', es_premium:false, audios_escuchados:0, fecha_creacion:firebase.firestore.FieldValue.serverTimestamp() });
        await ref.collection('chat').add(msg);
        chatHistory.push(msg);
      } else {
        startDate = doc.data().fecha_inicio || new Date().toISOString();
      }
    }

    async function cargarDatos() {
      const ref = db.collection('usuarios').doc(userId);
      unsubscribeChat = ref.collection('chat').orderBy('fecha','asc').onSnapshot(snap=>{
        chatHistory = snap.docs.map(d=>d.data()); renderChat(); actualizarContador();
      });
      unsubscribeGallery = ref.collection('usuarios').doc(userId).collection('gallery').orderBy('fecha','desc').onSnapshot(snap=>{
        galleryItems = snap.docs.map(d=>d.data()); renderGallery();
      });
    }

    function habilitar() {
      listo = true;
      document.querySelectorAll('button,input,form').forEach(e=>e.disabled=false);
    }

    function usarLocal() {
      startDate = localStorage.getItem('inicio') || new Date().toISOString();
      chatHistory = JSON.parse(localStorage.getItem('chat')) || [{sender:'bot', text:'¡Hola mi amor! Me alegra mucho verte 🥰'}];
      renderChat(); actualizarContador(); habilitar();
    }

    async function revisarLimiteAudio() {
      if(!userId) return false;
      const d = (await db.collection('usuarios').doc(userId).get()).data();
      if(d.es_premium) return {ok:true};
      const lim = APP_CONFIG.elevenlabs?.limiteGratis || 3;
      return d.audios_escuchados < lim ? {ok:true} : {ok:false};
    }

    async function voz(texto, btn) {
      btn.disabled = true; 
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

      // ✅ Cargamos toda la configuración actualizada incluyendo la velocidad
      const config = await cargarConfiguracionActual();
      const clave = config.elevenlabs?.apiKey;
      const idVoz = config.elevenlabs?.vozId;

      // Comprobaciones obligatorias
      if (!clave || clave.trim() === '') {
        alert('⚠️ Falta la clave API de ElevenLabs. Configúrala primero en el Panel de Administración');
        btn.disabled = false; 
        btn.innerHTML = '🔊 Escuchar';
        return;
      }
      if (!idVoz || idVoz.trim() === '') {
        alert('⚠️ Falta el ID de la voz en la configuración');
        btn.disabled = false; 
        btn.innerHTML = '🔊 Escuchar';
        return;
      }

      const ok = await revisarLimiteAudio();
      if(!ok.ok){
        alert(`🔊 Solo tienes ${config.elevenlabs?.limiteGratis || 3} audios gratis. Hazte Premium 💎`);
        btn.disabled = false; 
        btn.innerHTML = '🔊 Escuchar'; 
        return;
      }

      try {
        if(audioActivo) audioActivo.pause();

        // Limpiamos el texto para que no haya errores
        const textoLimpio = texto
          .replace(/[<>{}[\]\\]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (textoLimpio.length === 0) throw new Error("El mensaje está vacío");

        const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${idVoz}`,{
          method:'POST', 
          headers:{
            'xi-api-key': clave, 
            'Content-Type':'application/json'
          },
          body:JSON.stringify({ 
            text: textoLimpio, 
            model_id: config.elevenlabs.modelo || 'eleven_multilingual_v2', 
            voice_settings:{
              stability: config.elevenlabs.estabilidad ?? 0.72, 
              similarity_boost: config.elevenlabs.similitud ?? 0.8,
              speed: config.elevenlabs.velocidad ?? 0.99 // ✅ Aquí ya toma la velocidad configurada
            } 
          })
        });

        if(!res.ok) {
          const errorDatos = await res.json().catch(()=>null);
          const msgError = errorDatos?.detail?.message || `Error de la API: ${res.status}`;
          throw new Error(msgError);
        }

        const blob = await res.blob();
        audioActivo = new Audio(URL.createObjectURL(blob));
        await audioActivo.play();

        const userRef = db.collection('usuarios').doc(userId);
        const datosUsuario = (await userRef.get()).data();
        if(!datosUsuario.es_premium) await userRef.update({audios_escuchados:firebase.firestore.FieldValue.increment(1)});

      } catch(e){ 
        console.error("Error generando audio:", e);
        alert(`❌ No se pudo generar el audio: ${e.message}`); 
      } finally { 
        btn.disabled = false; 
        btn.innerHTML = '🔊 Escuchar'; 
      }
    }

    async function saveUserProfile() {
      if(!listo) return;
      const nom = document.getElementById('user-name').value.trim(), mail = document.getElementById('user-email').value.trim();
      try { await db.collection('usuarios').doc(userId).update({nombre:nom, correo:mail}); alert('✅ Guardado'); }
      catch(e){ localStorage.setItem('nom',nom); alert('Guardado localmente'); }
    }

    function actualizarContador() {
      const b = document.getElementById('counter-banner');
      if(!startDate) return;
      const d = Math.floor(Math.abs(new Date()-new Date(startDate))/(86400000));
      if(d>=365) { b.className="bg-amber-100 border border-amber-300 rounded-full py-1.5 px-4 text-xs font-bold text-amber-800 shadow-sm anniversary-badge"; b.innerHTML="¡¡FELIZ ANIVERSARIO DE UN AÑO!! 🎉❤️"; }
      else b.innerHTML = `Juntos desde el ${new Date(startDate).toLocaleDateString('es-ES',{day:'numeric',month:'short'})} llevamos <b>${d} días</b> 🥰`;
    }

    function switchTab(n) {
      ['chat','gallery','gifts','profile'].forEach(t=>{ document.getElementById(`tab-${t}`).classList.add('hidden'); document.getElementById(`nav-${t}`).classList.remove('text-rose-500','font-bold'); });
      document.getElementById(`tab-${n}`).classList.remove('hidden'); document.getElementById(`nav-${n}`).classList.add('text-rose-500','font-bold');
    }

    function renderChat() {
      const c = document.getElementById('chat-messages'); c.innerHTML = '';
      if(!chatHistory.length) { c.innerHTML = '<p class="text-center text-slate-400 text-sm">Sin mensajes aún</p>'; return; }
      chatHistory.forEach(m=>{
        const esUsuario = m.sender==='user';
        let extra = '';
        if(m.foto) extra += `<br><img src="${m.foto}" class="msg-image">`;
        if(m.audio) extra += `<br><audio controls class="msg-audio"><source src="${m.audio}">`;
        // Escapamos bien las comillas para que no rompa el código del botón
        const textoSeguro = m.text.replace(/'/g,"\\'").replace(/"/g,'&quot;');
        const btnVoz = !esUsuario ? `<br><button class="btn-audio" onclick="voz('${textoSeguro}',this)">🔊 Escuchar</button>` : '';
        c.insertAdjacentHTML('beforeend',`
          <div class="flex ${esUsuario?'justify-end':'justify-start'} mb-2">
            <div class="${esUsuario?'bg-rose-500 text-white':'bg-white border border-rose-100'} max-w-[80%] px-4 py-2.5 rounded-2xl shadow-sm text-sm break-words">
              ${(m.text||'').replace(/\n/g,'<br>')} ${extra} ${btnVoz}
            </div>
          </div>`);
      });
      c.scrollTop = c.scrollHeight;
    }

    function renderGallery() {
      const c = document.getElementById('gallery-content'); c.innerHTML = '';
      if(!galleryItems.length) { c.innerHTML = '<p class="col-span-2 text-center text-slate-400 text-sm py-8">Sin recuerdos aún 🥺</p>'; return; }
      galleryItems.forEach(i=>{
        let h = '';
        if(i.tipo==='imagen') h = `<div class="gallery-item cursor-pointer" onclick="window.open('${i.url}','_blank')"><img src="${i.url}" class="gallery-img"><p class="text-xs p-2 text-center">${i.descripcion||''}</p></div>`;
        if(i.tipo==='audio') h = `<div class="gallery-audio"><i class="fas fa-music text-rose-500 text-xl mb-1"></i><audio controls class="w-full mt-2"><source src="${i.url}"><p class="text-xs mt-1">${i.descripcion||'Audio'}</p></div>`;
        c.insertAdjacentHTML('beforeend',h);
      });
    }

    document.getElementById('chat-form').addEventListener('submit', async e=>{
      e.preventDefault(); if(!listo) return;
      const inp = document.getElementById('chat-input'), txt = inp.value.trim();
      if(!txt) return; inp.disabled = true;
      try {
        await db.collection('usuarios').doc(userId).collection('chat').add({sender:'user', text:txt, fecha:firebase.firestore.FieldValue.serverTimestamp()});
        inp.value = ''; await responder(txt);
      } catch(e){ console.error(e); alert("Error al enviar"); }
      finally { inp.disabled = false; }
    });

    async function responder(txt) {
      const clave = apiKeyFromFirebase || APP_CONFIG.ai.apiKey;
      if(!clave || clave.includes('TU_CLAVE')) {
        await db.collection('usuarios').doc(userId).collection('chat').add({sender:'bot', text:'Recuerda configurar tu clave API ❤️', fecha:firebase.firestore.FieldValue.serverTimestamp()});
        return;
      }
      try {
        const res = await fetch(`${APP_CONFIG.ai.baseUrl}/chat/completions`,{
          method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${clave}`}, timeout:25000,
          body:JSON.stringify({model:APP_CONFIG.ai.model, temperature:0.8, max_tokens:800,
            messages: [{role:'system', content:APP_CONFIG.ai.systemPrompt}, ...chatHistory.slice(-18).map(m=>({role:m.sender==='user'?'user':'assistant', content:m.text})), {role:'user', content:txt}]
          })
        });
        const d = await res.json(); if(!res.ok) throw new Error();
        await db.collection('usuarios').doc(userId).collection('chat').add({sender:'bot', text:d.choices[0].message.content.trim(), fecha:firebase.firestore.FieldValue.serverTimestamp()});
      } catch(e) {
        await db.collection('usuarios').doc(userId).collection('chat').add({sender:'bot', text:'Se me fue la señal un ratito, pero sigo pensando en ti 🥰', fecha:firebase.firestore.FieldValue.serverTimestamp()});
      }
    }

    async function sendGift(n) {
      if(!listo) return;
      await db.collection('usuarios').doc(userId).collection('chat').add({sender:'user', text:`Te envié: ${n}`, fecha:firebase.firestore.FieldValue.serverTimestamp()});
      await db.collection('usuarios').doc(userId).collection('chat').add({sender:'bot', text:`¡Muchísimas gracias por el ${n}! Eres el mejor 🥰`, fecha:firebase.firestore.FieldValue.serverTimestamp()});
      switchTab('chat');
    }

    document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('beforeunload', ()=>{ if(unsubscribeChat) unsubscribeChat(); if(unsubscribeGallery) unsubscribeGallery(); });
  </script>
</body>
</html>
